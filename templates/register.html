{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrapper card p-4">
  <h3 class="mb-3 text-center">Create your account</h3>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" maxlength="80" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" maxlength="120" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required minlength="6">
    </div>
    <div class="mb-3">
      <label class="form-label">I am a...</label>
      <select name="role" class="form-select">
        <option value="individual">Salaried Professional</option>
        <option value="student">Student</option>
        <option value="freelancer">Freelancer</option>
        <option value="household">Household Manager</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary w-100">Create Account</button>
  </form>
  <p class="text-center mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
